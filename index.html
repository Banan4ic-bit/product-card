<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Карточка продукта</title>
</head>
<body>
  <div class="container">
    <h1 class="title">Выбери свой продукт</h1>
    <div class="control-buttons">
      <button id="control-first-card-button" >Поменять цвет первой карточки</button>
      <button id="control-all-cards-button" >Поменять цвет всех карточек</button>
      <button id="external-link-button">Открыть гугл</button>
      <button id="log-button">Вывести сообщение в консоль лог</button>
      <button id="control-toggle-button" class="control-button control-button--modified">Поменять цвет кнопки</button>
    </div>

    <ul id="product_card_list" class="product_card_list">    </ul>

    <template id="product_card-template">
      <li class="product_card">
        <img class="product_card_image" src="" alt="" width="290" height="245">
        <span class="product_card_category"></span>
        <h2 class="product_card_name"></h2>
        <p class="product_card_description"></p>
      <div class="product_card_compound_wrapper">
        <span class="product_card_compound_label">Состав:</span>
        <ul class="product_card_compound">
        </ul>
      </div>
      <div class="product_card_price">
        <span class="product_card_price_label">Цена</span>
        <span class="product_card_price_value"> </span>
      </div>
      </li>
    </template>
    
  </div>

  <ul id="categories_list"></ul>


  <script src="main.js"></script>
  <script src="homework-5.js"></script>
  <script src="homework-6.js"></script>
  <script type="module" src="homework-7.js"></script>
  <script type="module" src="homework-8.js"></script>
</body>
</html>
